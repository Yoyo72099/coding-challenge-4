<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Fridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff8ef;
        --ink: #5b4a5c;
        --pink: #ffd4e1;
        --blue: #cfe8ff;
        --mint: #d5ffe8;
        --fridge: #f4f8ff;
        --fridge-border: #aac8ef;
        --accent: #ff7fa6;
        --ok: #61c281;
        --warn: #f4b24f;
        --danger: #f06b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Baloo 2", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 20%, #fff1c9, transparent 35%),
          radial-gradient(circle at 80% 10%, #ffe2f0, transparent 40%), var(--bg);
      }

      .page {
        min-height: 100vh;
        max-width: 640px;
        margin: 0 auto;
        padding: 1rem 1rem 3rem;
        display: block;
        align-items: start;
      }

      h2,
      p {
        margin: 0;
      }

      .fridge-stage {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .fridge {
        width: min(460px, 100%);
        perspective: 1300px;
      }

      .fridge-body {
        position: relative;
        border-radius: 28px;
        border: 4px solid var(--fridge-border);
        background: linear-gradient(180deg, #ffffff, var(--fridge));
        min-height: 480px;
        box-shadow: 0 20px 30px rgba(103, 135, 186, 0.25);
        overflow: hidden;
        padding: 1rem;
      }

      .sticker {
        position: absolute;
        z-index: 3;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        border: 2px solid #fff;
        color: #7f5d65;
        font-weight: 700;
        font-size: 0.95rem;
      }

      .sticker-heart {
        top: 1rem;
        left: 1rem;
        background: var(--pink);
      }

      .sticker-star {
        top: 1rem;
        right: 1rem;
        background: var(--mint);
      }

      .door-button {
        position: absolute;
        z-index: 4;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 0.45rem 1rem;
        cursor: pointer;
        box-shadow: 0 8px 14px rgba(240, 117, 159, 0.35);
      }

      .door {
        position: absolute;
        inset: 0;
        background: linear-gradient(150deg, #e7f2ff, #ccddfb);
        border-right: 4px solid #a2c0ec;
        border-radius: 24px;
        transform-origin: left center;
        transition: transform 380ms ease;
        z-index: 2;
      }

      .door-handle {
        position: absolute;
        right: 1.1rem;
        top: 45%;
        width: 16px;
        height: 100px;
        border-radius: 999px;
        background: #fdf4ff;
        border: 3px solid #bcccf8;
      }

      .fridge.open .door {
        transform: rotateY(-84deg);
      }

      .inside {
        height: 100%;
        padding: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .inside-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.75rem;
      }

      .stats-text {
        background: var(--blue);
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.95rem;
      }

      .food-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
      }

      .food-item {
        position: relative;
        overflow: hidden;
        background: #fff;
        border: 2px solid #d9e6fb;
        border-radius: 14px;
        min-height: 116px;
      }

      .food-photo {
        width: 100%;
        height: 116px;
        object-fit: cover;
        display: block;
      }

      .badge {
        position: absolute;
        top: 0.45rem;
        right: 0.45rem;
        font-weight: 700;
        border-radius: 999px;
        padding: 0.12rem 0.55rem;
        color: #fff;
        font-size: 0.88rem;
      }

      .badge.fresh {
        background: var(--ok);
      }

      .badge.soon {
        background: var(--warn);
      }

      .badge.expired {
        background: var(--danger);
      }

      .door-button:focus-visible {
        outline: 3px solid #a8d0ff;
        outline-offset: 2px;
      }

      @media (max-width: 520px) {
        .fridge-body {
          min-height: 420px;
        }

        .food-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="fridge-stage">
        <div class="fridge" id="fridge">
          <div class="fridge-body">
            <div class="sticker sticker-heart">love</div>
            <div class="sticker sticker-star">yum</div>

            <button class="door-button" id="toggleDoor" type="button" aria-expanded="false">
              Open door
            </button>

            <div class="door" id="door">
              <div class="door-handle" aria-hidden="true"></div>
            </div>

            <div class="inside">
              <header class="inside-header">
                <h2>Inside today</h2>
                <span id="statsText" class="stats-text"></span>
              </header>
              <ul id="foodList" class="food-list" aria-live="polite"></ul>
            </div>
          </div>
        </div>
      </section>
    </main>

    <template id="foodItemTemplate">
      <li class="food-item">
        <img class="food-photo" />
        <span class="badge"></span>
      </li>
    </template>

    <script>
      const fridge = document.querySelector("#fridge");
      const toggleDoorBtn = document.querySelector("#toggleDoor");
      const foodList = document.querySelector("#foodList");
      const statsText = document.querySelector("#statsText");
      const itemTemplate = document.querySelector("#foodItemTemplate");

      const defaultItems = [
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8612.PNG?raw=true",
          alt: "Fridge item photo 1",
          daysLeft: 2,
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8613.PNG?raw=true",
          alt: "Fridge item photo 2",
          daysLeft: 1,
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8614.PNG?raw=true",
          alt: "Fridge item photo 3",
          daysLeft: 4,
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8615.PNG?raw=true",
          alt: "Fridge item photo 4",
          daysLeft: 0,
        },
      ];
      const items = defaultItems;

      function statusByDays(daysLeft) {
        if (daysLeft <= 0) {
          return { cls: "expired", label: "Expired", message: "Use now!" };
        }
        if (daysLeft <= 2) {
          return { cls: "soon", label: "Soon", message: `${daysLeft} day left` };
        }
        return { cls: "fresh", label: "Fresh", message: `${daysLeft} days left` };
      }

      function renderItems() {
        foodList.innerHTML = "";
        let expiredCount = 0;

        items.forEach((item) => {
          const node = itemTemplate.content.firstElementChild.cloneNode(true);
          const status = statusByDays(item.daysLeft);
          if (status.cls === "expired") expiredCount += 1;

          const img = node.querySelector(".food-photo");
          img.src = item.imageUrl;
          img.alt = item.alt;
          img.loading = "lazy";

          const badge = node.querySelector(".badge");
          badge.className = `badge ${status.cls}`;
          badge.textContent = status.label;

          foodList.appendChild(node);
        });

        statsText.textContent = `${items.length} photos, ${expiredCount} expired`;
      }

      function toggleDoor() {
        const nowOpen = fridge.classList.toggle("open");
        toggleDoorBtn.textContent = nowOpen ? "Close door" : "Open door";
        toggleDoorBtn.setAttribute("aria-expanded", String(nowOpen));
      }

      toggleDoorBtn.addEventListener("click", toggleDoor);

      renderItems();
    </script>
  </body>
</html>
