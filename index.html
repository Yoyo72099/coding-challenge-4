<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cute Fridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #d9e8df;
        --bg-deep: #b8d3c5;
        --silver: #edf4ef;
        --fridge: #f1f6f3;
        --fridge-border: #8db8a2;
        --accent: #6b8f7b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Baloo 2", system-ui, sans-serif;
        background: radial-gradient(circle at 15% 20%, rgba(245, 255, 248, 0.92), transparent 40%),
          radial-gradient(circle at 85% 12%, rgba(210, 236, 222, 0.8), transparent 38%),
          linear-gradient(140deg, var(--silver), var(--bg) 48%, var(--bg-deep));
      }

      .page {
        min-height: 100vh;
        max-width: 1120px;
        margin: 0 auto;
        padding: 1.2rem 1rem 2.4rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 1rem;
      }

      .fridge-stage {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .fridge {
        width: min(760px, 100%);
        perspective: 1300px;
      }

      .fridge-body {
        position: relative;
        border-radius: 34px;
        border: 4px solid var(--fridge-border);
        background: linear-gradient(180deg, #f8fdf9, var(--fridge));
        min-height: 740px;
        box-shadow: 0 24px 48px rgba(89, 126, 108, 0.26);
        overflow: hidden;
        padding: 1.4rem;
      }

      .door-button {
        position: absolute;
        z-index: 4;
        bottom: 1.2rem;
        left: 50%;
        transform: translateX(-50%);
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #eef8f2;
        font: inherit;
        font-weight: 700;
        width: 68px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 9px 15px rgba(88, 116, 100, 0.3);
        font-size: 1.15rem;
        letter-spacing: 0.02em;
      }

      .door {
        position: absolute;
        inset: 0;
        background: linear-gradient(155deg, #d4e4d8, #b8d2c3);
        border-right: 4px solid #90b8a5;
        border-radius: 30px;
        transform-origin: left center;
        transition: transform 380ms ease;
        z-index: 2;
      }

      .door-handle {
        position: absolute;
        right: 1.1rem;
        top: 45%;
        width: 16px;
        height: 100px;
        border-radius: 999px;
        background: #ecf5ef;
        border: 3px solid #a9c6b7;
      }

      .fridge.open .door {
        transform: rotateY(-84deg);
      }

      .inside {
        position: absolute;
        inset: 1.2rem 1.2rem 5.8rem 1.2rem;
        overflow: hidden;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(239, 247, 242, 0.7));
      }

      .inside-canvas {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .food-list {
        list-style: none;
        margin: 0;
        padding: 0;
        position: relative;
        width: 100%;
        height: 100%;
      }

      .food-item {
        position: absolute;
        overflow: hidden;
        border-radius: 0;
        width: 38%;
        height: 28%;
      }

      .food-photo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .add-panel {
        align-self: center;
        background: rgba(239, 247, 242, 0.8);
        border: 2px dashed #7ea892;
        border-radius: 20px;
        padding: 0.9rem;
        box-shadow: 0 12px 24px rgba(89, 126, 108, 0.18);
      }

      .add-panel h2 {
        margin: 0 0 0.4rem;
        font-size: 1.1rem;
        color: #4f7562;
      }

      .add-panel p {
        margin: 0 0 0.55rem;
        color: #5f7f70;
        font-size: 0.93rem;
      }

      .add-form {
        display: grid;
        gap: 0.45rem;
      }

      .add-form input {
        border: 1px solid #8fb6a1;
        border-radius: 10px;
        padding: 0.48rem 0.55rem;
        font: inherit;
        background: rgba(255, 255, 255, 0.95);
      }

      .add-form button {
        border: none;
        border-radius: 12px;
        background: #6b8f7b;
        color: #eef8f2;
        font: inherit;
        font-weight: 600;
        padding: 0.42rem 0.65rem;
        cursor: pointer;
      }

      .door-button:focus-visible {
        outline: 3px solid #b3d3bf;
        outline-offset: 2px;
      }

      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }

        .add-panel {
          max-width: 500px;
          width: 100%;
          margin: 0 auto;
        }
      }

      @media (max-width: 520px) {
        .fridge-body {
          min-height: 640px;
          padding: 1rem;
        }

        .food-item {
          width: 43%;
          height: 24%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="fridge-stage">
        <div class="fridge open" id="fridge">
          <div class="fridge-body">
            <button class="door-button" id="toggleDoor" type="button" aria-expanded="true" aria-label="Toggle fridge door">
              <span aria-hidden="true">◉</span>
            </button>

            <div class="door" id="door">
              <div class="door-handle" aria-hidden="true"></div>
            </div>

            <div class="inside">
              <div class="inside-canvas">
                <ul id="foodList" class="food-list" aria-live="polite"></ul>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="add-panel">
        <h2>可以加入食物</h2>
        <p>贴一张图片链接，放进冰箱。</p>
        <form id="addForm" class="add-form">
          <input id="foodImageUrl" type="url" placeholder="https://..." required />
          <button type="submit">加入</button>
        </form>
      </aside>
    </main>

    <template id="foodItemTemplate">
      <li class="food-item">
        <img class="food-photo" />
      </li>
    </template>

    <script>
      const fridge = document.querySelector("#fridge");
      const toggleDoorBtn = document.querySelector("#toggleDoor");
      const foodList = document.querySelector("#foodList");
      const itemTemplate = document.querySelector("#foodItemTemplate");
      const addForm = document.querySelector("#addForm");
      const foodImageUrlInput = document.querySelector("#foodImageUrl");

      const defaultItems = [
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8612.PNG?raw=true",
          alt: "Fridge item photo 1",
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8613.PNG?raw=true",
          alt: "Fridge item photo 2",
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8614.PNG?raw=true",
          alt: "Fridge item photo 3",
        },
        {
          id: crypto.randomUUID(),
          imageUrl: "https://github.com/Yoyo72099/coding-challenge-4/blob/main/IMG_8615.PNG?raw=true",
          alt: "Fridge item photo 4",
        },
      ];
      const items = defaultItems;
      const scatterLayouts = [
        { left: 6, top: 8, rotate: -8, z: 2 },
        { left: 56, top: 14, rotate: 7, z: 3 },
        { left: 10, top: 54, rotate: 5, z: 4 },
        { left: 54, top: 58, rotate: -7, z: 1 },
      ];

      function shuffledLayouts() {
        const clone = [...scatterLayouts];
        for (let i = clone.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [clone[i], clone[j]] = [clone[j], clone[i]];
        }
        return clone;
      }

      function renderItems() {
        foodList.innerHTML = "";
        const layouts = shuffledLayouts();

        items.forEach((item, index) => {
          const node = itemTemplate.content.firstElementChild.cloneNode(true);
          const layout = layouts[index % layouts.length];

          const img = node.querySelector(".food-photo");
          img.src = item.imageUrl;
          img.alt = item.alt;
          img.loading = "lazy";

          node.style.left = `${layout.left}%`;
          node.style.top = `${layout.top}%`;
          node.style.transform = `rotate(${layout.rotate}deg)`;
          node.style.zIndex = String(layout.z);

          foodList.appendChild(node);
        });
      }

      function toggleDoor() {
        const nowOpen = fridge.classList.toggle("open");
        toggleDoorBtn.innerHTML = nowOpen
          ? '<span aria-hidden="true">◉</span>'
          : '<span aria-hidden="true">◎</span>';
        toggleDoorBtn.setAttribute("aria-expanded", String(nowOpen));
      }

      function addFoodFromUrl(event) {
        event.preventDefault();
        const imageUrl = foodImageUrlInput.value.trim();
        if (!imageUrl) return;

        items.unshift({
          id: crypto.randomUUID(),
          imageUrl,
          alt: "Added food image",
        });

        if (items.length > 12) {
          items.pop();
        }

        foodImageUrlInput.value = "";
        renderItems();
      }

      toggleDoorBtn.addEventListener("click", toggleDoor);
      addForm.addEventListener("submit", addFoodFromUrl);

      renderItems();
    </script>
  </body>
</html>
